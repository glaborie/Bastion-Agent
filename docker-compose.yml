# =============================================================================
# Bastion-Agent — full local stack (8 services)
# -----------------------------------------------------------------------------
#   1. gateway        FastAPI control plane + HTMX dashboard      :8000
#   2. worker         ARQ agent worker (tool execution / HITL)
#   3. db             PostgreSQL 16 (audit chain, approvals)
#   4. redis          Redis 7 (ARQ queue + AES token vault)
#   5. keycloak       OIDC identity provider                      :8080
#   6. omniroute      OpenAI-compatible inference router          :8001
#   7. llama-cpp      CUDA local inference (confidential traffic) :8002
#   8. otel-collector OTLP fan-out to Langfuse / Arize
#
# Prerequisites: `cp .env.example .env`, and a GGUF model in ./models/.
# =============================================================================

name: bastion-agent

x-app-environment: &app-environment
  APP_NAME: ${APP_NAME:-bastion-agent}
  ENVIRONMENT: ${ENVIRONMENT:-local}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # Container-internal topology (overrides the host-side values in .env).
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bastion}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-bastion}
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
  DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-5}
  DATABASE_ECHO: ${DATABASE_ECHO:-false}
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
  REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-50}
  KEYCLOAK_ISSUER: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}/realms/${KEYCLOAK_REALM:-bastion}
  KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-bastion-gateway}
  KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-bastion-gateway}
  KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?set KEYCLOAK_CLIENT_SECRET in .env}
  KEYCLOAK_REDIRECT_URI: ${KEYCLOAK_REDIRECT_URI:-http://localhost:8000/auth/callback}
  KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:-bastion}/protocol/openid-connect/certs
  # Back-channel token endpoint: the gateway reaches Keycloak internally even
  # though tokens carry the public issuer (http://localhost:8080/...).
  KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:-bastion}/protocol/openid-connect/token
  KEYCLOAK_SCOPES: ${KEYCLOAK_SCOPES:-openid profile email}
  KEYCLOAK_JWKS_CACHE_TTL_SECONDS: ${KEYCLOAK_JWKS_CACHE_TTL_SECONDS:-300}
  KEYCLOAK_JWKS_MIN_REFRESH_SECONDS: ${KEYCLOAK_JWKS_MIN_REFRESH_SECONDS:-5}
  KEYCLOAK_LEEWAY_SECONDS: ${KEYCLOAK_LEEWAY_SECONDS:-30}
  KEYCLOAK_HTTP_TIMEOUT_SECONDS: ${KEYCLOAK_HTTP_TIMEOUT_SECONDS:-10}
  SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-bastion_session}
  SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
  SESSION_REFRESH_LEEWAY_SECONDS: ${SESSION_REFRESH_LEEWAY_SECONDS:-60}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
  LOGIN_STATE_TTL_SECONDS: ${LOGIN_STATE_TTL_SECONDS:-600}
  APPROVAL_PAGE_SIZE: ${APPROVAL_PAGE_SIZE:-100}
  AUDIT_PAGE_SIZE: ${AUDIT_PAGE_SIZE:-50}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
  RATE_LIMIT_DASHBOARD_PER_WINDOW: ${RATE_LIMIT_DASHBOARD_PER_WINDOW:-60}
  RATE_LIMIT_CHAT_PER_WINDOW: ${RATE_LIMIT_CHAT_PER_WINDOW:-120}
  EVAL_REPORT_PATH: ${EVAL_REPORT_PATH:-artifacts/evals/latest.json}
  VAULT_MASTER_KEY: ${VAULT_MASTER_KEY:?set VAULT_MASTER_KEY in .env}
  VAULT_TTL_SECONDS: ${VAULT_TTL_SECONDS:-1800}
  DLP_ENTITIES: ${DLP_ENTITIES:-PERSON,EMAIL_ADDRESS,PHONE_NUMBER,IBAN_CODE,IP_ADDRESS,CREDIT_CARD,US_SSN,API_KEY}
  DLP_SCORE_THRESHOLD: ${DLP_SCORE_THRESHOLD:-0.35}
  APPROVAL_HMAC_SECRET: ${APPROVAL_HMAC_SECRET:?set APPROVAL_HMAC_SECRET in .env}
  APPROVAL_TTL_SECONDS: ${APPROVAL_TTL_SECONDS:-900}
  TOOL_WORKSPACE_ROOT: ${TOOL_WORKSPACE_ROOT:-/tmp/bastion-workspace}
  TOOL_MAX_READ_BYTES: ${TOOL_MAX_READ_BYTES:-262144}
  TOOL_MAX_WRITE_BYTES: ${TOOL_MAX_WRITE_BYTES:-1048576}
  TOOL_MAX_ARGUMENT_BYTES: ${TOOL_MAX_ARGUMENT_BYTES:-1048576}
  TOOL_RESUME_AUTO_ENQUEUE: ${TOOL_RESUME_AUTO_ENQUEUE:-true}
  ARQ_CONNECTION_TIMEOUT_SECONDS: ${ARQ_CONNECTION_TIMEOUT_SECONDS:-2}
  ARQ_QUEUE_NAME: ${ARQ_QUEUE_NAME:-bastion:jobs}
  CLASSIFIER_MODEL_PATH: ${CLASSIFIER_MODEL_PATH:-}
  CLASSIFIER_TOKENIZER_PATH: ${CLASSIFIER_TOKENIZER_PATH:-}
  CLASSIFIER_MAX_TOKENS: ${CLASSIFIER_MAX_TOKENS:-512}
  CLASSIFIER_CONFIDENCE_THRESHOLD: ${CLASSIFIER_CONFIDENCE_THRESHOLD:-0.55}
  CLASSIFIER_INJECTION_MODEL_PATH: ${CLASSIFIER_INJECTION_MODEL_PATH:-}
  CLASSIFIER_INJECTION_TOKENIZER_PATH: ${CLASSIFIER_INJECTION_TOKENIZER_PATH:-}
  CLASSIFIER_SAFETY_MODEL_PATH: ${CLASSIFIER_SAFETY_MODEL_PATH:-}
  CLASSIFIER_SAFETY_TOKENIZER_PATH: ${CLASSIFIER_SAFETY_TOKENIZER_PATH:-}
  CLASSIFIER_INJECTION_MAX_TOKENS: ${CLASSIFIER_INJECTION_MAX_TOKENS:-2048}
  CLASSIFIER_SAFETY_MAX_TOKENS: ${CLASSIFIER_SAFETY_MAX_TOKENS:-512}
  CLASSIFIER_INJECTION_PROFILE: ${CLASSIFIER_INJECTION_PROFILE:-production}
  CLASSIFIER_INJECTION_THRESHOLD: ${CLASSIFIER_INJECTION_THRESHOLD:-}
  CLASSIFIER_SAFETY_UNSAFE_THRESHOLD: ${CLASSIFIER_SAFETY_UNSAFE_THRESHOLD:-0.5}
  CLASSIFIER_SAFETY_CATEGORY_THRESHOLD: ${CLASSIFIER_SAFETY_CATEGORY_THRESHOLD:-0.3}
  CLASSIFIER_INJECTION_MODEL_SHA256: ${CLASSIFIER_INJECTION_MODEL_SHA256:-}
  CLASSIFIER_SAFETY_MODEL_SHA256: ${CLASSIFIER_SAFETY_MODEL_SHA256:-}
  CLASSIFIER_RULES_FLOOR: ${CLASSIFIER_RULES_FLOOR:-true}
  OMNIROUTE_BASE_URL: http://omniroute:20128
  OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-sk-local-dev}
  OMNIROUTE_TIMEOUT_SECONDS: ${OMNIROUTE_TIMEOUT_SECONDS:-120}
  OMNIROUTE_MAX_RETRIES: ${OMNIROUTE_MAX_RETRIES:-1}
  OMNIROUTE_RETRY_BACKOFF_SECONDS: ${OMNIROUTE_RETRY_BACKOFF_SECONDS:-0.25}
  MODEL_LOCAL_ALIAS: ${MODEL_LOCAL_ALIAS:-local-llama}
  MODEL_CLOUD_ALIAS: ${MODEL_CLOUD_ALIAS:-cloud-primary}
  OTEL_ENABLED: ${OTEL_ENABLED:-true}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_TRACES_SAMPLER_RATIO: ${OTEL_TRACES_SAMPLER_RATIO:-1.0}
  CANARY_PREFIX: ${CANARY_PREFIX:-BASTION-CANARY-}
  EGRESS_TRIP_TTL_SECONDS: ${EGRESS_TRIP_TTL_SECONDS:-900}

x-app-build: &app-build
  build:
    context: .
    dockerfile: Dockerfile
  image: bastion-agent:${BASTION_IMAGE_TAG:-local}
  env_file:
    - path: .env
      required: false
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  networks:
    - bastion-net

services:
  # ---------------------------------------------------------------------------
  # Gateway: OIDC + RBAC, DLP pipeline, dashboard, health probes
  # ---------------------------------------------------------------------------
  gateway:
    <<: *app-build
    # No container_name: the app tier is replica-safe (Compose derives names).
    command: >-
      uvicorn gateway.main:app
      --host 0.0.0.0 --port 8000 --proxy-headers
      --forwarded-allow-ips=${FORWARDED_ALLOW_IPS:-127.0.0.1}
    environment:
      <<: *app-environment
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-bastion-gateway}
    ports:
      # Loopback-only by default: this is a local control plane. Front it with a
      # TLS reverse proxy (and set FORWARDED_ALLOW_IPS) before exposing it.
      - "127.0.0.1:${GATEWAY_PORT:-8000}:8000"
    volumes:
      # DeepEval run summaries written by the test harness (read-only here).
      - ./artifacts:/app/artifacts:ro
      # ONNX classifier repositories (ADR-011). Mounted read-only, never baked;
      # the image stays small and a model swap does not require a rebuild. It is
      # mounted inside the app tree so the repo-relative paths in .env work
      # identically on the host and in the container.
      - ./models:/app/models:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      # Inference backends (omniroute, llama-cpp) are deliberately NOT hard
      # dependencies: approvals and the dashboard must stay up even when the
      # model backends are degraded. Tracing is best-effort too; the distroless
      # collector has no shell to probe.
      otel-collector:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request
          urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 20s

  # ---------------------------------------------------------------------------
  # ARQ worker: guarded tool execution, HITL suspension and resumption
  # ---------------------------------------------------------------------------
  worker:
    <<: *app-build
    command: ["arq", "agent.runtime.WorkerSettings"]
    environment:
      <<: *app-environment
      OTEL_SERVICE_NAME: bastion-worker
    volumes:
      # Same read-only classifier mount as the gateway (ADR-011).
      - ./models:/app/models:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    stop_grace_period: 30s

  # ---------------------------------------------------------------------------
  # PostgreSQL 16: append-only audit chain + suspended approvals
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    container_name: bastion-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bastion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-bastion}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # initdb + gosu privilege drop
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    networks:
      - bastion-net

  # ---------------------------------------------------------------------------
  # Redis 7: ARQ queue + AES-256-GCM encrypted token vault (30 min TTL)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
    container_name: bastion-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command:
      # Pass redis-server arguments directly: the image's entrypoint then chowns
      # /data and drops from root to the `redis` user. Wrapping the server in
      # `sh -c` (as an earlier revision did) bypasses that drop and leaves the
      # server running as root, which breaks AOF once /data is redis-owned.
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # entrypoint chowns /data then gosu-drops to the redis user
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    networks:
      - bastion-net

  # ---------------------------------------------------------------------------
  # Keycloak: OIDC identity provider, realm imported from config/keycloak
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.0@sha256:09a381c715ab0b111835b70f2905955274843a219c6f27efb348e4d9f4086858
    container_name: bastion-keycloak
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: INFO
    volumes:
      - ./config/keycloak:/opt/keycloak/data/import:ro
      - keycloak_data:/opt/keycloak/data
    ports:
      # Loopback-only: the IdP is for this host. Front it with a reverse proxy
      # (and TLS) before exposing it to a network.
      - "127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"
    healthcheck:
      # The UBI-micro image has bash but no curl/wget. The management port
      # (9000) is enabled via KC_HEALTH_ENABLED.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - bastion-net

  # ---------------------------------------------------------------------------
  # OmniRoute: OpenAI-compatible router (`local-llama` -> llama.cpp,
  #            `cloud-primary` -> OpenRouter)
  # ---------------------------------------------------------------------------
  omniroute:
    # Upstream image runs as root and writes /root/.omniroute; re-owning it is
    # not supported without upstream changes. Compensated by cap_drop + no
    # published port beyond loopback.
    image: ${OMNIROUTE_IMAGE:-rigging/omniroute:3.8.52}
    container_name: bastion-omniroute
    environment:
      PORT: "20128"
      OMNIROUTE_SERVER_HOST: 0.0.0.0
      # Never expose an unauthenticated inference plane to the compose network.
      REQUIRE_API_KEY: "true"
      # Only consumed on first initialisation of the data volume.
      INITIAL_PASSWORD: ${OMNIROUTE_ADMIN_PASSWORD:?set OMNIROUTE_ADMIN_PASSWORD in .env}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Bearer token OmniRoute uses for the `local-llama` upstream.
      LLAMA_API_KEY: ${LLAMA_API_KEY:-dev-only-llama-api-key}
    volumes:
      - omniroute_data:/root/.omniroute
      - ./config/omniroute:/config:ro
    ports:
      - "127.0.0.1:${OMNIROUTE_PORT:-8001}:20128"
    healthcheck:
      # /api/health is unauthenticated; the image ships Node 22 with fetch().
      test:
        - CMD
        - node
        - -e
        - |
          fetch("http://127.0.0.1:20128/api/health")
            .then((r) => process.exit(r.ok ? 0 : 1))
            .catch(() => process.exit(1));
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - bastion-net

  # ---------------------------------------------------------------------------
  # llama.cpp: confidential prompts never leave the host
  # ---------------------------------------------------------------------------
  llama-cpp:
    # Upstream image runs as root; it only reads the read-only model mount.
    image: ${LLAMA_CPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:f28803153f5ce48a6c8deaef694f58fca09b5dd79baca75fced670ec23b7bd71}
    container_name: bastion-llama-cpp
    command:
      - --model
      - /models/${LLAMA_MODEL_FILE:-qwen2.5-7b-instruct-q4_k_m.gguf}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --api-key
      - ${LLAMA_API_KEY:-dev-only-llama-api-key}
      - --alias
      - ${LLAMA_MODEL_ALIAS:-qwen2.5-7b-instruct-q4_k_m}
      - --ctx-size
      - "${LLAMA_CTX_SIZE:-8192}"
      - --n-gpu-layers
      - "${LLAMA_N_GPU_LAYERS:-99}"
      - --parallel
      - "1"
      - --metrics
    volumes:
      - ./models:/models:ro
    ports:
      - "127.0.0.1:${LLAMA_PORT:-8002}:8080"
    healthcheck:
      # bash TCP probe: the image has no curl/wget. Model load can take minutes.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s
    # GPU access uses the NVIDIA Container Toolkit (device cgroup), not Linux
    # capabilities. On a CPU-only host use the `server` image, set
    # LLAMA_N_GPU_LAYERS=0, and delete the deploy.resources block below.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - bastion-net

  # ---------------------------------------------------------------------------
  # OpenTelemetry Collector: OTLP in, Langfuse/Arize out
  # ---------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0@sha256:a2a52e43c1a80aa94120ad78c2db68780eb90e6d11c8db5b3ce2f6a0cc6b5029
    container_name: bastion-otel-collector
    # Two configs: the base (receivers, processors, exporters, retry policy) and
    # an overlay that decides the traces pipeline's exporter list. The overlay
    # is the only thing that changes between local debug and remote fan-out, so
    # there is one copy of every setting.
    command: ["--config=/etc/otelcol/config.yaml", "--config=/etc/otelcol/export.yaml"]
    environment:
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-local}
      # Langfuse Cloud (EU). Use us./jp./hipaa. subdomains for other regions.
      LANGFUSE_OTLP_ENDPOINT: ${LANGFUSE_OTLP_ENDPOINT:-https://cloud.langfuse.com/api/public/otel}
      LANGFUSE_OTLP_AUTH: ${LANGFUSE_OTLP_AUTH:-}
      # Arize AX OTLP/HTTP base endpoint; the collector appends /v1/traces.
      ARIZE_OTLP_ENDPOINT: ${ARIZE_OTLP_ENDPOINT:-https://otlp.arize.com}
      ARIZE_API_KEY: ${ARIZE_API_KEY:-}
      ARIZE_SPACE_ID: ${ARIZE_SPACE_ID:-}
      ARIZE_PROJECT_NAME: ${ARIZE_PROJECT_NAME:-bastion-agent}
      # OpenLit, self-hosted on the host: the exporter appends /v1/traces.
      OPENLIT_OTLP_ENDPOINT: ${OPENLIT_OTLP_ENDPOINT:-http://host.docker.internal:4320}
      OPENLIT_OTLP_AUTH: ${OPENLIT_OTLP_AUTH:-}
    # host.docker.internal is a Docker Desktop name; on Linux it must be mapped
    # explicitly for the collector to reach OpenLit's host-published OTLP port.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config/otel/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
      # Choose the pipeline overlay. `otel-collector-no-export.yaml` (default)
      # keeps egress local; `otel-collector-openlit.yaml` adds the self-hosted
      # OpenLit collector; `otel-collector-export.yaml` adds Langfuse and Arize.
      - ./config/otel/${OTEL_REMOTE_EXPORT_CONFIG:-otel-collector-no-export.yaml}:/etc/otelcol/export.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    # Distroless image: no shell/curl, so an in-container healthcheck is
    # impossible. The collector exposes `health_check` on :13133 for external
    # probes, and consumers treat tracing as best-effort (service_started).
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - bastion-net

volumes:
  pgdata:
  redisdata:
  keycloak_data:
  omniroute_data:

networks:
  bastion-net:
    driver: bridge
