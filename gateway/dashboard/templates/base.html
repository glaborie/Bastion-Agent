<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="referrer" content="no-referrer">
    <title>{% block title %}Command Control{% endblock %} · Bastion-Agent</title>
    <link rel="stylesheet" href="/static/vendor/pico-2.0.6.min.css">
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/vendor/htmx-2.0.4.min.js" defer></script>
  </head>
  <body hx-headers='{"X-CSRF-Token": "{{ csrf_token or "" }}"}'>
    <header class="container">
      <nav>
        <ul>
          <li><strong>Bastion-Agent</strong></li>
        </ul>
        <ul>
          <li>
            <a href="/dashboard"
               {% if request.url.path == "/dashboard" %}aria-current="page"{% endif %}>Approvals</a>
          </li>
          <li>
            <a href="/dashboard/audit"
               {% if request.url.path.startswith("/dashboard/audit") %}aria-current="page"{% endif %}>Audit</a>
          </li>
        </ul>
      </nav>
      {% if principal %}
        <div class="operator-bar">
          <span>
            <strong>{{ principal.display_name }}</strong>
            <small>{{ principal.roles | sort | join(", ") }}</small>
          </span>
          <form method="post" action="/auth/logout" class="inline-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token or '' }}">
            <button type="submit" class="secondary outline">Sign out</button>
          </form>
        </div>
      {% endif %}
    </header>

    <main class="container">
      {% block content %}{% endblock %}
    </main>

    <footer class="container">
      <small>
        Bastion-Agent · zero-trust control plane ·
        <a href="/health">health</a>
      </small>
    </footer>
  </body>
</html>
