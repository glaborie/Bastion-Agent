# PostgreSQL HBA for the pki profile (ADR-019 decision 4).
#
# TCP is certificate-only: the CN of the leaf must name the database role. The
# Unix socket keeps trust because it is unreachable from the bridge and is what
# the image healthcheck uses.

local   all all                 trust
hostssl all all 0.0.0.0/0       cert
hostssl all all ::/0            cert
hostnossl all all 0.0.0.0/0     reject
hostnossl all all ::/0          reject
