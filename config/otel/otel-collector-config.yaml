# =============================================================================
# OpenTelemetry Collector (contrib) — Bastion-Agent fan-out
# -----------------------------------------------------------------------------
# Receives OTLP from the gateway/worker and exports spans.
#
# By default traces go to the local `debug` exporter so `docker compose logs`
# shows them. Enable a backend by adding its exporter to the `traces` pipeline
# below (Langfuse and Arize exporters are pre-configured).
#
# Every referenced variable is supplied by docker-compose.yml with a non-empty
# default; the collector's env provider does not support shell-style `:-`.
# =============================================================================

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  resource:
    attributes:
      - key: deployment.environment
        value: ${env:DEPLOYMENT_ENV}
        action: upsert
      - key: service.namespace
        value: bastion-agent
        action: upsert
  batch:
    send_batch_size: 512
    timeout: 5s

exporters:
  # Local visibility: one line per span batch in the collector logs.
  debug:
    verbosity: normal

  # Langfuse v3+/OTLP ingestion.
  # Requires LANGFUSE_OTLP_AUTH = base64("<public_key>:<secret_key>").
  otlphttp/langfuse:
    endpoint: ${env:LANGFUSE_OTLP_ENDPOINT}
    encoding: json
    headers:
      Authorization: "Basic ${env:LANGFUSE_OTLP_AUTH}"
      x-langfuse-ingestion-version: "4"

  # Arize Phoenix / Arize AX OTLP.
  otlp/arize:
    endpoint: ${env:ARIZE_OTLP_ENDPOINT}
    headers:
      api_key: "${env:ARIZE_API_KEY}"
    tls:
      insecure: false

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      # Add `otlphttp/langfuse` and/or `otlp/arize` here to ship spans externally.
      exporters: [debug]
