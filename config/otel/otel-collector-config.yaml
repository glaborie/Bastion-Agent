# =============================================================================
# OpenTelemetry Collector (contrib) — Bastion-Agent fan-out
# -----------------------------------------------------------------------------
# Receives OTLP from the gateway/worker and fans traces out to:
#   • Langfuse Cloud (EU: cloud.langfuse.com; US: us.cloud.langfuse.com)
#   • Arize AX (OTLP/HTTP)
#   • local debug logs
#
# Egress is currently local debug only: both remote exporters are defined below
# but are not wired into the traces pipeline. The Langfuse free tier was
# exhausted by dashboard polling, and telemetry.py now excludes those poll URLs
# so that a re-enabled export carries real traffic instead of poll noise. To
# resume export, add the exporter back to the pipeline's `exporters` list.
#
# Every ${env:...} variable below is supplied by docker-compose.yml with a
# non-empty default, because the collector's env provider does not implement
# shell-style `${VAR:-default}` fallbacks.
# =============================================================================

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  resource:
    attributes:
      - key: deployment.environment
        value: ${env:DEPLOYMENT_ENV}
        action: upsert
      - key: service.namespace
        value: bastion-agent
        action: upsert
  batch:
    send_batch_size: 512
    timeout: 5s

exporters:
  # Local visibility only (span-batch counters, not span bodies).
  debug:
    verbosity: basic

  # Langfuse Cloud / self-hosted. Auth is base64("<public_key>:<secret_key>").
  otlphttp/langfuse:
    endpoint: ${env:LANGFUSE_OTLP_ENDPOINT}
    encoding: json
    headers:
      Authorization: "Basic ${env:LANGFUSE_OTLP_AUTH}"
      x-langfuse-ingestion-version: "4"
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      queue_size: 1000

  # Arize AX over OTLP/HTTP. Arize documents the endpoint as
  # https://otlp.arize.com/v1 (verified: without `/v1` their ingest returns 400).
  # `x-project-name` routes the traces into a specific Arize project.
  otlphttp/arize:
    endpoint: ${env:ARIZE_OTLP_ENDPOINT}
    # Arize's OTLP/HTTP ingest expects JSON, not the exporter's default protobuf.
    encoding: json
    headers:
      space_id: ${env:ARIZE_SPACE_ID}
      api_key: ${env:ARIZE_API_KEY}
      x-project-name: ${env:ARIZE_PROJECT_NAME}
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      queue_size: 1000

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      # Remote egress paused (see the header). Re-add otlphttp/arize and/or
      # otlphttp/langfuse here to resume fan-out.
      exporters: [debug]
