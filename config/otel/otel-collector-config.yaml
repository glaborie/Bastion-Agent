# =============================================================================
# OpenTelemetry Collector (contrib) — Bastion-Agent fan-out
# -----------------------------------------------------------------------------
# Receives OTLP from the gateway/worker and fans traces out to:
#   • Langfuse Cloud (EU: cloud.langfuse.com; US: us.cloud.langfuse.com)
#   • Arize AX (OTLP/HTTP)
#   • local debug logs
#
# Egress is decided by an overlay file, not by this one. docker-compose.yml
# passes this file as the first --config and one of
# otel-collector-no-export.yaml (default: local debug only) or
# otel-collector-export.yaml (debug + Langfuse + Arize) as the second. Maps
# merge across files, but a list replaces the same path, so the overlay owns
# the traces pipeline's `exporters` list while everything below stays in one
# copy. Select it with OTEL_REMOTE_EXPORT_CONFIG in .env.
#
# The Langfuse free tier was once exhausted by dashboard polling; telemetry.py
# now excludes those poll URLs, so remote export carries real traffic. The
# `exporters: [debug]` line at the bottom of this file is only the fallback used
# if the collector is started without an overlay.
#
# Every ${env:...} variable below is supplied by docker-compose.yml with a
# non-empty default, because the collector's env provider does not implement
# shell-style `${VAR:-default}` fallbacks.
# =============================================================================

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  resource:
    attributes:
      - key: deployment.environment
        value: ${env:DEPLOYMENT_ENV}
        action: upsert
      - key: service.namespace
        value: bastion-agent
        action: upsert
  batch:
    send_batch_size: 512
    timeout: 5s
  # Egress is metered, so drop the two span classes whose volume a caller
  # controls and whose diagnostic value is nil:
  #
  #   * ASGI send/receive event spans ("GET /docs http send"): three per HTTP
  #     request at ~0.03 ms each. The server span already carries the latency.
  #   * Unmatched paths (404). On 2026-11-10 one client polling a route this
  #     gateway does not implement sent ~11,500 spans/day to Arize and tripped
  #     its volume limit; an unauthenticated caller can do the same on purpose.
  #     Path scans belong at the proxy/firewall, not in a paid trace backend.
  #
  # Dropped spans are dropped for `debug` too: the filter sits in the single
  # traces pipeline, so what the collector logs is what the backends receive.
  filter/noise:
    error_mode: ignore
    traces:
      span:
        - 'IsMatch(name, ".* http (send|receive)$")'
        - 'attributes["http.status_code"] == 404'
        - 'attributes["http.response.status_code"] == 404'

exporters:
  # Local visibility only (span-batch counters, not span bodies).
  debug:
    verbosity: basic

  # Langfuse Cloud / self-hosted. Auth is base64("<public_key>:<secret_key>").
  otlphttp/langfuse:
    endpoint: ${env:LANGFUSE_OTLP_ENDPOINT}
    encoding: json
    headers:
      Authorization: "Basic ${env:LANGFUSE_OTLP_AUTH}"
      x-langfuse-ingestion-version: "4"
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      queue_size: 1000

  # Arize AX over OTLP/HTTP. Two things bite and both are silent-at-install:
  #
  #   1. ARIZE_OTLP_ENDPOINT is the *base* host: the exporter appends
  #      /v1/traces itself. Including Arize's documented /v1 signal path yields
  #      /v1/v1/traces, which answers 200 "ok" and drops the batch.
  #   2. Their ingest parses JSON but does not gunzip, so the exporter's default
  #      gzip compression answers 400 on every batch ("invalid character '\x1f'
  #      looking for beginning of value"). Protobuf fails the same way.
  #
  # `x-project-name` routes the traces into a specific Arize project.
  otlphttp/arize:
    endpoint: ${env:ARIZE_OTLP_ENDPOINT}
    encoding: json
    compression: none
    headers:
      space_id: ${env:ARIZE_SPACE_ID}
      api_key: ${env:ARIZE_API_KEY}
      x-project-name: ${env:ARIZE_PROJECT_NAME}
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      queue_size: 1000

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, filter/noise, batch]
      # Fallback when no overlay is passed. The overlay mounted at
      # /etc/otelcol/export.yaml replaces this list (see the header).
      exporters: [debug]
