# =============================================================================
# Overlay: fan traces out to Opik Cloud
# -----------------------------------------------------------------------------
# Enable with OTEL_REMOTE_EXPORT_CONFIG=otel-collector-opik.yaml in .env, then
# recreate the collector:
#
#     docker compose up -d --force-recreate otel-collector
#
# It replaces only the traces pipeline's exporter list; the receiver, the
# processors and the endpoint/header settings all stay in
# otel-collector-config.yaml, which is passed as the first --config.
#
# Traces leave the host: Opik Cloud is metered and reaches the network, so this
# overlay needs OPIK_API_KEY from .env plus OPIK_WORKSPACE (account workspace)
# and OPIK_PROJECT_NAME (destination project). ADR-014 records that selecting
# this backend means trace egress. Switch back to otel-collector-no-export.yaml
# to stop the export entirely.
# =============================================================================

service:
  pipelines:
    traces:
      exporters: [debug, otlphttp/opik]
