# =============================================================================
# OmniRoute routing contract — Bastion-Agent
# -----------------------------------------------------------------------------
# Two aliases are exposed to the agent router (`agent/routing/client.py`):
#
#   local-llama    CONFIDENTIAL prompts -> llama.cpp on the host GPU. No egress.
#   cloud-primary  PUBLIC prompts       -> OpenRouter cloud models.
#
# OmniRoute persists this state in its own SQLite store. Apply it idempotently:
#
#   uv run python scripts/omniroute_bootstrap.py --write-env
#
# The values below are the ones verified against OmniRoute 3.8.52. IDs are
# generated per deployment; the names, prefixes and model references are stable
# and are what the bootstrap script reconciles.
# =============================================================================

version: 2

# --- Custom OpenAI-compatible provider node (llama.cpp) ----------------------
provider_nodes:
  llama-cpp-local:
    id: openai-compatible-chat-local
    type: openai-compatible
    api_type: chat
    base_url: http://llama-cpp:8080/v1
    # Model references are addressed as "<prefix>/<model>".
    prefix: llama
    # NOTE: credentials cannot live in customHeaders (OmniRoute rejects auth
    # headers there). The bearer token is stored on the provider *connection*
    # below, sourced from LLAMA_API_KEY.
    credential_env: LLAMA_API_KEY

# --- Provider connections ----------------------------------------------------
connections:
  llama-cpp-local:
    provider: openai-compatible-chat-local
    name: llama-cpp-local
    url: http://llama-cpp:8080/v1
    api_key_env: LLAMA_API_KEY
    is_active: true

  openrouter:
    provider: openrouter
    name: openrouter
    url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    is_active: true

# --- Combos (the aliases the agent sends as `model`) -------------------------
combos:
  local-llama:
    strategy: priority          # single target; no cloud fallback by design
    privacy: on-prem
    models:
      # llama.cpp is started with `--alias qwen2.5-7b-instruct-q4_k_m`.
      - llama/qwen2.5-7b-instruct-q4_k_m

  cloud-primary:
    strategy: priority          # ordered failover across cloud models
    privacy: third-party
    models:
      - openrouter/openai/gpt-4o-mini
      - openrouter/anthropic/claude-haiku-4.5

# --- Gateway API key ---------------------------------------------------------
# The /v1 plane enforces bearer auth (REQUIRE_API_KEY=true). The bootstrap
# registers one key named "bastion-gateway" and stores it in OMNIROUTE_API_KEY.
gateway_key:
  name: bastion-gateway
  env: OMNIROUTE_API_KEY

# --- Invariants --------------------------------------------------------------
invariants:
  # A confidential prompt must never silently degrade to a cloud provider:
  # `local-llama` has no cloud target.
  confidential_aliases: [local-llama]
