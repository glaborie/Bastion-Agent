# Bastion-Agent image-scan policy.
#
# This file is read by scripts/check_trivy_report.py, NOT by Trivy. Trivy runs
# with explicit flags and no --ignorefile, so every suppression is applied by
# the gate after the finding is reported: a CVE cannot be hidden before the
# gate sees it, and each entry is scoped to an image and expires.
#
# Schema (no other keys are accepted):
#   version: 1
#   ignore:
#     - id: CVE-YYYY-NNNNN        # Trivy vulnerability id
#       images: [<image slug>]    # scripts/image_inventory.py --slug <image>; "*" allowed
#       statement: "<why>"        # at least 10 characters, reviewed
#       expires: YYYY-MM-DD       # the entry stops suppressing after this date
#
# An expired entry fails the gate even if no finding matches it, so a stale
# acceptance cannot outlive its review.

version: 1
ignore:
  # postgres:16.15-alpine is the current 16.x image. The finding is the Go
  # stdlib in `gosu`, the entrypoint privilege-dropper, not the Postgres server:
  # gosu does not terminate TLS. No rebuilt image exists, so the acceptance is
  # bound to the next 16.x rebuild.
  - id: CVE-2025-68121
    images: [postgres-16.15-alpine]
    statement: "Go stdlib in gosu, the entrypoint helper of postgres:16.15-alpine; gosu does not serve TLS and no rebuilt image exists."
    expires: 2027-02-09

  # RedisInsight 3.8 is the latest published tag (verified against Docker Hub).
  # It is an optional development UI, started only with the redis-ui profile and
  # never on the request path. Both findings are in bundled Node dependencies.
  - id: CVE-2026-59873
    images: [redis-redisinsight-3.8]
    statement: "node-tar bundled in RedisInsight 3.8, the latest published tag; the redis-ui profile is optional and off the request path."
    expires: 2027-02-09
  - id: CVE-2026-90711
    images: [redis-redisinsight-3.8]
    statement: "proxy-addr bundled in RedisInsight 3.8, the latest published tag; the redis-ui profile is optional and off the request path."
    expires: 2027-02-09
