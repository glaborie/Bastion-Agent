  - id: CVE-2026-33815
    images: [smallstep-step-ca-0.28.4]
    statement: "jackc/pgx v5.7.2 in the step-ca binary; fixed in 5.9.0, reached by the next step-ca release."
    expires: 2026-12-16
  - id: CVE-2026-33816
    images: [smallstep-step-ca-0.28.4]
    statement: "jackc/pgx v5.7.2 in the step-ca binary; fixed in 5.9.0, reached by the next step-ca release."
    expires: 2026-12-16

  # ---------------------------------------------------------------------------
  # louislam/uptime-kuma 2.5.12 (IDEA-039). The availability monitor sits behind
  # the `infra` profile, publishes only a loopback UI, has no request path and
  # initiates every connection it makes, so a compromised package here reaches
  # monitoring state, not customer traffic. 2.5.12 is the latest published tag
  # (verified 2026-11-18); the Node and Go findings below are fixed only in a
  # newer upstream build we cannot produce, and the Debian packages have no
  # patched version in the image's suite. Accepted for 90 days, then reviewed
  # against the next upstream release.
  - id: CVE-2026-40468
    images: [louislam-uptime-kuma-2.5.12]
    statement: "gawk 1:5.2.1-2 in the uptime-kuma image's Debian suite has no patched version; the monitor is off the request path and loopback-only."
    expires: 2027-02-16
  - id: CVE-2026-40469
    images: [louislam-uptime-kuma-2.5.12]
    statement: "gawk 1:5.2.1-2 in the uptime-kuma image's Debian suite has no patched version; the monitor is off the request path and loopback-only."
