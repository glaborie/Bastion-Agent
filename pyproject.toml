[project]
name = "bastion-agent"
version = "0.1.0"
description = "High-assurance, zero-trust enterprise AI agent harness and control plane"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Bastion-Agent Engineering" }]

dependencies = [
    # --- Web gateway -------------------------------------------------------
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "python-multipart>=0.0.12",
    "jinja2>=3.1.4,<4.0.0",
    # --- Async worker & persistence ---------------------------------------
    "arq>=0.26.0,<0.27.0",
    "redis>=5.0.8,<6.0.0",
    "sqlalchemy[asyncio]>=2.0.36,<2.1.0",
    "asyncpg>=0.30.0,<1.0.0",
    # --- Config & validation ----------------------------------------------
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "httpx>=0.27.2,<1.0.0",
    # --- Security: OIDC, AES-256-GCM vault, HMAC tokens --------------------
    "pyjwt[crypto]>=2.9.0,<3.0.0",
    # 50.x is the first line with no open OSV advisories for this package; every
    # release up to 49.0.0 still carries the 4 HIGH findings (see
    # docs/THREAT_MODEL.md). Keep the major bounded and re-audit on upgrade.
    "cryptography>=50.0.2,<51.0.0",
    # --- DLP: deterministic entity detection & anonymisation --------------
    "presidio-analyzer>=2.2.355,<3.0.0",
    "presidio-anonymizer>=2.2.355,<3.0.0",
    "spacy>=3.8.0,<3.9.0",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    # --- Semantic sensitivity classifier ----------------------------------
    "onnxruntime>=1.20.0,<2.0.0",
    "numpy>=1.26.4,<3.0.0",
    "tokenizers>=0.20.0,<1.0.0",
    # --- Observability -----------------------------------------------------
    "opentelemetry-sdk>=1.28.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0,<2.0.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0,<1.0.0",
    "opentelemetry-instrumentation-asyncpg>=0.49b0,<1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.2.0,<2.0.0",
    "fakeredis>=2.26.0,<3.0.0",
    "deepeval>=2.5.0,<4.0.0",
    "mypy>=1.13.0,<2.0.0",
    "ruff>=0.8.0,<1.0.0",
    "pylint>=4.0.9,<5.0.0",
    # Arrives transitively via presidio, but tests/test_otel_config.py parses the
    # collector YAML, so the dependency is declared rather than assumed.
    "pyyaml>=6.0.2,<7.0.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["settings", "logging_setup", "telemetry"]

[tool.setuptools.packages.find]
include = ["gateway*", "agent*", "db*"]

# ---------------------------------------------------------------------------
# Tooling configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a live PostgreSQL instance (set TEST_DATABASE_URL)",
    "redis_integration: requires a live Redis instance (set REDIS_TEST_URL)",
    "model_integration: requires a live llama.cpp endpoint (set LLAMA_CPP_BASE_URL)",
]
asyncio_default_fixture_loop_scope = "function"

[tool.pylint.main]
py-version = "3.11"

[tool.pylint.basic]
const-rgx = "^(_[a-z][a-z0-9_]*|[A-Z_][A-Z0-9_]*)$"

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
# Ruff owns style (E/F/I/UP/B/ASYNC/S/RUF/SIM) and mypy owns types; pylint is
# kept for its error/warning checkers and genuine refactor smells. Everything
# disabled below is either a deliberate pattern here or a checker Ruff covers.
disable = [
    "missing-class-docstring",        # C0115
    "missing-function-docstring",     # C0116
    "import-outside-toplevel",        # C0415 - lazy imports keep startup light
    "duplicate-code",                 # R0801 - shared kwargs blocks
    "too-few-public-methods",         # R0903 - dataclasses and ARQ/ASGI hooks
    "too-many-arguments",             # R0913 - explicit dependencies
    "too-many-positional-arguments",  # R0917
    "too-many-instance-attributes",   # R0902 - flat config/state records
    "too-many-return-statements",     # R0911
    "too-many-branches",              # R0912
    "too-many-locals",                # R0914
    "too-many-statements",            # R0915 - one flat sweep over every backlog field
    "global-statement",               # W0603 - process-wide singletons
    "unused-argument",                # W0613 - protocol signatures (ctx/context)
    "redefined-outer-name",           # W0621 - FastAPI app factory and fixtures
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]
exclude = ["^\\.venv/", "^tests/data/"]

[[tool.mypy.overrides]]
module = ["arq.*", "presidio_analyzer.*", "presidio_anonymizer.*", "spacy.*", "onnxruntime.*", "deepeval.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF", "SIM", "T20"]
ignore = [
    "S101",    # assert is fine in tests
    "S104",    # binding 0.0.0.0 is intentional inside containers
    "B008",    # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107", "S311", "S603"]
# Regex patterns describe credentials; they are not credentials themselves.
"agent/dlp/presidio.py" = ["S105"]
# Operator CLI scripts print to the terminal and call fixed loopback URLs.
"scripts/*" = ["T201", "S310"]
"settings.py" = ["S105"]

[tool.ruff.lint.isort]
known-first-party = ["gateway", "agent", "db", "settings"]
