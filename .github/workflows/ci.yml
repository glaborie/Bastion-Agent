name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly, so new advisories are caught even when nobody pushes.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OTEL_ENABLED: "false"
  PYTHONUNBUFFERED: "1"

# Actions are pinned to full commit SHAs (tag in the trailing comment). Bump them
# deliberately, and prefer releases that are at least two weeks old.

jobs:
  # One cheap job decides what a pull request actually needs. Everything runs on
  # master, the weekly schedule and manual runs; a PR skips a suite only when the
  # diff cannot affect it. Skipped jobs bill nothing, so this is the main lever
  # on total runner minutes.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
      evals: ${{ steps.filter.outputs.evals }}
      scan: ${{ steps.filter.outputs.scan }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: filter
        name: Classify the diff
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            printf 'docs_only=false\nevals=true\nscan=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags --quiet origin "${{ github.base_ref }}"
          changed=$(git diff --name-only --diff-filter=ACMR FETCH_HEAD...HEAD)

          # Docs only: every touched path is Markdown, an image, or under wiki/.
          # docs/ is deliberately not included: docs/tools/v1.json is the tool
          # catalogue the guards validate at startup.
          if [ -n "$changed" ] && ! grep -qvE '(\.md$|^wiki/|\.(png|jpe?g|gif|svg)$)' <<<"$changed"; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

          # Evals: the classifier, the two redaction stages it routes for, and the
          # golden corpus are the only things those gates assert on.
          if grep -qE '^(agent/(routing|dlp|egress)/|tests/data/|tests/test_(classifier|dlp|egress|eval)[^/]*\.py|scripts/(run_evals|check_classifier_dispatch)\.py|settings\.py|pyproject\.toml|models/)' <<<"$changed"; then
            echo "evals=true" >> "$GITHUB_OUTPUT"
          else
            echo "evals=false" >> "$GITHUB_OUTPUT"
          fi

          # Scan: only when the scanner itself moves. Master and the weekly run
          # always scan, so a pin bump is verified within a day (ADR-016).
          if grep -qE '^(trivy\.yaml|scripts/(scan_images\.sh|trivy-scan\.sh|image_inventory\.py|aggregate_trivy_reports\.py|check_trivy_report\.py)|\.github/workflows/ci\.yml)$' <<<"$changed"; then
            echo "scan=true" >> "$GITHUB_OUTPUT"
          else
            echo "scan=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Lint, types, policy checks
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # The Pylint step diffs against the PR base, which needs real history.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Ruff lint
        run: uv run --no-sync ruff check .

      - name: Ruff format
        run: uv run --no-sync ruff format --check .

      - name: Mypy (strict)
        run: uv run --no-sync mypy gateway agent db settings.py telemetry.py logging_setup.py

      # Replaces the old pylint workflow, which ran with --exit-zero and could never fail.
      #
      # Pull requests lint only the Python files they touch: pylint's startup and
      # import graph dominate the step, and re-linting untouched files every push
      # buys nothing. The whole tree still runs on master and on any PR that
      # changes pylint's version or configuration, so a plugin or pin bump cannot
      # land without being validated against everything.
      - name: Pylint
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          full=1
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --quiet origin "$BASE_REF"
            changed=$(git diff --name-only --diff-filter=ACMR FETCH_HEAD...HEAD)
            if grep -qE '^(pyproject\.toml|pylintrc|\.pylintrc|\.github/workflows/ci\.yml)$' <<<"$changed"; then
              echo "pylint config or pin changed; linting the whole tree"
            else
              full=0
            fi
          fi
          if [ "$full" = 1 ]; then
            mapfile -t targets < <(git ls-files '*.py')
          else
            mapfile -t targets < <(grep -E '\.py$' <<<"$changed" || true)
          fi
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "no Python files changed; pylint skipped"
            exit 0
          fi
          echo "pylint on ${#targets[@]} file(s)"
          uv run --no-sync pylint "${targets[@]}"

      - name: Repository policy checks
        run: |
          uv run --no-sync python scripts/check_adrs.py
          uv run --no-sync python scripts/validate_tool_catalog.py --check
          uv run --no-sync python scripts/validate_rbac.py
          uv run --no-sync python scripts/recalculate_dread.py --check

  tests:
    name: Tests (Python ${{ matrix.python-version }}, PostgreSQL 16)
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bastion
          POSTGRES_PASSWORD: bastion
          POSTGRES_DB: bastion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bastion -d bastion_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # The quarantine/canary tests assert real Redis TTL semantics, which
      # fakeredis cannot. Provisioning it here turns those five tests from
      # silent skips into gates.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The suite refuses to run destructive tests on a database whose name lacks "test".
      TEST_DATABASE_URL: postgresql+asyncpg://bastion:bastion@localhost:5432/bastion_test
      REDIS_TEST_URL: redis://localhost:6379/0
      # Audit-witness store (IDEA-021). Started below; without it the witness
      # tests skip, and the skip gate fails the job rather than hiding that.
      AUDIT_WITNESS_IMAGE: cgr.dev/chainguard/minio:latest@sha256:786cb11d340b1a657de8dc899560e36e1d1fb371d3d6f3eb6c903a0bb0cec714
      AUDIT_WITNESS_ENDPOINT: http://localhost:9000
      AUDIT_WITNESS_BUCKET: bastion-audit
      AUDIT_WITNESS_REGION: us-east-1
      AUDIT_WITNESS_ACCESS_KEY: bastion-witness
      AUDIT_WITNESS_SECRET_KEY: dev-only-minio-witness-password
      AUDIT_WITNESS_HMAC_SECRET: dev-only-audit-witness-hmac-secret-change-me
      MINIO_ROOT_USER: bastion-minio-root
      MINIO_ROOT_PASSWORD: dev-only-minio-root-password
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      # A GitHub Actions service cannot override an image's command, and the
      # distroless MinIO image has no default one, so start it directly. The
      # init script runs inside the same image (it ships mc) and is idempotent.
      - name: Start the audit-witness store
        run: |
          docker run -d --name audit-witness -p 9000:9000 \
            -e MINIO_ROOT_USER -e MINIO_ROOT_PASSWORD \
            "${AUDIT_WITNESS_IMAGE}" server /data
          # The port opens before the server is ready, and mc closes the probe
          # connection; wait on the health endpoint the runner can curl.
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1 && break
            sleep 1
          done
          docker run --rm --network host \
            -v "$PWD/scripts/init_audit_witness.sh:/opt/bastion/init-audit-witness.sh:ro" \
            -v "$PWD/config/minio/audit-witness-policy.json:/opt/bastion/audit-witness-policy.json:ro" \
            -e MINIO_ENDPOINT=http://127.0.0.1:9000 \
            -e MINIO_ROOT_USER -e MINIO_ROOT_PASSWORD \
            -e AUDIT_WITNESS_BUCKET -e AUDIT_WITNESS_ACCESS_KEY \
            -e AUDIT_WITNESS_SECRET_KEY -e AUDIT_WITNESS_RETENTION_YEARS=7 \
            --entrypoint /bin/bash \
            "${AUDIT_WITNESS_IMAGE}" /opt/bastion/init-audit-witness.sh ||
            { docker logs audit-witness; exit 1; }

      - name: Run tests
        run: uv run --no-sync pytest -ra --junitxml=pytest-report.xml

      # Database and Redis tests skip silently when their URLs are missing. This job runs
      # with both, so the only acceptable skips are the ones below -- an external service
      # this runner does not have. Refresh this list deliberately.
      - name: Fail on unexpected skips
        run: |
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          allowed = (
              # The `evals` job downloads the ONNX models and gates on them.
              "ONNX classifier repositories not downloaded",
              # No GPU inference endpoint here; the model-integration canary is run
              # manually against a live llama.cpp (DEMO.md, scripts/demo_model_canary.py).
              "LLAMA_CPP_BASE_URL is not set",
              # The Falco rules-validation test needs the Falco image; this
              # unprivileged job does not pull it. scripts/falco_smoke.sh is the
              # host-level check (ADR-017).
              "Falco image is not present locally",
              # The east-west TLS tests need the opt-in `pki` profile, which this
              # job does not start (ADR-019). The refusal cases are exercised by
              # `scripts/scan_images.sh`'s sibling run and locally per docs/PKI.md;
              # the unit half of tests/test_db_tls.py still runs here.
              "the pki profile is not running",
              "PKI_TEST_REDIS_URL is not set",
          )
          unexpected = []
          for case in ET.parse("pytest-report.xml").iter("testcase"):
              for skipped in case.findall("skipped"):
                  message = skipped.get("message") or ""
                  if not any(reason in message for reason in allowed):
                      unexpected.append(f"{case.get('classname')}::{case.get('name')}: {message}")
          if unexpected:
              print("\n".join(unexpected))
              sys.exit("unexpected skipped tests")
          PY

  evals:
    name: Zero-tolerance eval gates (real ONNX models)
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.evals == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Pinned in .env.example and ADR-011. Keep these in step with that file.
      INJECTION_REPO: Horizon-Labs/prompt-injection-guard-small
      INJECTION_REV: 2efc2ed5abecd21eb45c2506d231a65d6e392b85
      INJECTION_SHA256: 61cd0741cdbfcc229e32e1de1392f352736d87d1e8b3c2b67ad9836bb7910d5d
      SAFETY_REPO: onnx-community/content-safety-guard-small-ONNX
      SAFETY_REV: 74e953e4b14199e152899135cb176a0998135baf
      SAFETY_SHA256: 156b2b60eb1606d4f3c25913bb4dfc234b0be9b7bb85f29365cf29729f3ce2aa
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Restore ONNX models
        id: models
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: models
          key: onnx-${{ env.INJECTION_REV }}-${{ env.SAFETY_REV }}

      - name: Download ONNX models
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          uvx --from huggingface_hub==2.2.0 hf download "$INJECTION_REPO" \
            onnx/model_quantized.onnx tokenizer.json config.json \
            --revision "$INJECTION_REV" \
            --local-dir models/prompt-injection-guard-small
          uvx --from huggingface_hub==2.2.0 hf download "$SAFETY_REPO" \
            onnx/model_quantized.onnx tokenizer.json config.json \
            --revision "$SAFETY_REV" \
            --local-dir models/content-safety-guard-small

      # Runs on cache hits too, so a poisoned cache cannot swap the classifier.
      - name: Verify model digests
        run: |
          echo "$INJECTION_SHA256  models/prompt-injection-guard-small/onnx/model_quantized.onnx" | sha256sum -c -
          echo "$SAFETY_SHA256  models/content-safety-guard-small/onnx/model_quantized.onnx" | sha256sum -c -

      # The pinned int8 graphs do not reproduce on every hosted CPU: a runner
      # without AVX-512 marks every benign sentinel unsafe (ADR-011). The verdict
      # is written to the job summary and only the systemic signature exempts the
      # classifier gate; a failed row is never exempted.
      - name: Check the inference environment
        id: dispatch
        run: uv run --no-sync python scripts/check_classifier_dispatch.py

      # Exits non-zero on any failure. A skipped gate counts as a failure unless
      # the dispatch verdict exempted it.
      - name: Run eval gates
        run: |
          uv run --no-sync python scripts/run_evals.py \
            --dispatch-verdict "${{ steps.dispatch.outputs.verdict }}"

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-report
          path: artifacts/evals/latest.json
          if-no-files-found: warn
          retention-days: 7

  supply-chain:
    name: Supply chain (OSV + image SBOM)
    needs: changes
    # The OSV audit reads uv.lock; a documentation-only diff cannot move it.
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    # A full scan saves every image, including the CUDA llama.cpp image, so the
    # job is disk- and network-heavy. See ADR-016 for the cadence trade-off.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      # Exit 1: unignored advisories. Exit 2: the audit could not run.
      - name: Audit uv.lock against OSV
        run: uv run --no-sync python scripts/update_threat_intel.py

      - name: Upload advisory report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: threat-intel-report
          path: artifacts/threat-intel/latest.json
          if-no-files-found: warn
          retention-days: 7

      # The image scan answers "do the shipped images still contain a
      # CRITICAL?". Its inputs are the pins, the lockfile and the scanner itself,
      # so the `changes` job decides whether a pull request runs it; master, the
      # schedule and manual runs always do (ADR-016).
      - name: Restore the Trivy database cache
        if: needs.changes.outputs.scan == 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .cache/trivy
          # The run id makes every save unique; restore-keys always picks the
          # newest previous copy and Trivy refreshes it when it is stale.
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      # Builds the local gateway image, exports every image the compose stack
      # ships and scans the tarballs with the digest-pinned Trivy service (no
      # Docker socket). Exits 1 on an unsuppressed CRITICAL or an expired entry
      # in trivy.yaml; writes artifacts/compliance/<date>/.
      - name: Scan images and publish the SBOM
        if: needs.changes.outputs.scan == 'true'
        env:
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
          SCAN_JOBS: "6"
        run: |
          mkdir -p "$TRIVY_CACHE_DIR"
          # The scanner runs as root with cap_drop: ALL and no DAC_OVERRIDE.
          chmod 0777 "$TRIVY_CACHE_DIR"
          ./scripts/scan_images.sh --build-missing

      - name: Upload image SBOM and CVE report
        if: always() && needs.changes.outputs.scan == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compliance-reports
          path: artifacts/compliance/
          if-no-files-found: error
          # Development cadence: keep the report long enough to review the run,
          # not long enough to pay for storage. Raise it before an audit.
          retention-days: 7

  # Single stable check name to require in branch protection.
  ci-ok:
    name: ci-ok
    if: always() && github.event_name != 'schedule'
    needs: [changes, quality, tests, evals, supply-chain]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

