name: Metrics

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  # The action opens a pull request instead of pushing to the protected branch.
  pull-requests: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # master requires ci-ok, so a direct push from this job is rejected. The
      # action now commits to a per-run branch and opens a pull request against
      # master, which keeps a human in the loop.
      #
      # Because the pull request is created with GITHUB_TOKEN, GitHub does not
      # start a workflow run for it, so ci-ok stays "Expected" on that pull
      # request. Merge it as an admin (branch protection does not enforce on
      # admins). Replacing the token with a fine-grained PAT would make CI run
      # on it and allow output_action: pull-request-squash to merge unattended.
      - name: Generate repository metrics
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: glaborie
          repo: Bastion-Agent
          template: repository
          filename: metrics.svg
          # Base branch of the pull request; the action commits to a branch
          # named metrics-run-<run id> and opens the pull request from it.
          committer_branch: master
          output_action: pull-request
          plugin_activity: yes
          plugin_activity_days: 14
          plugin_activity_limit: 5
          plugin_languages: yes
          plugin_stargazers: yes
          plugin_contributors: yes
